[project]
name = "rig"
version = "0.1.0"
description = "Manage multiple profiles for each agent harnesses."
readme = "README.md"
authors = [{ name = "Chris1320", email = "me@chrisfromnowhere.me" }]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "textual>=1.0.0",
    "typer>=0.15.0",
]

[project.scripts]
rig = "rig:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.0",
    "isort>=9.0.2",
    "nuitka>=4.2.2",
    "pylint>=4.1.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.isort]
profile = "black"

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "unused-argument",
    "fixme",
]
